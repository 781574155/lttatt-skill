name: Lint

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: arc-runner-set-k8s
    permissions:
      packages: read
      statuses: write
    steps:
      - name: Set Git to use HTTP/1.1
        run: git config --global http.version HTTP/1.1

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ vars.LTTATT_READ_WRITE_APP_ID }}
          private-key: ${{ secrets.LTTATT_READ_WRITE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Load super-linter configuration
        run: grep -E -v '^[[:space:]]*$|^[[:space:]]*#' .super-linter.env >> "$GITHUB_ENV"

      - name: Super-linter
        uses: 781574155/super-linter@v8.3.0-tanqi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit and push linting fixes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "chore: fix linting issues"
          commit_user_name: super-linter[bot]
          commit_user_email: super-linter@bots.noreply.github.com
          skip_fetch: true
