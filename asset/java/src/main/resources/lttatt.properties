server.forward-headers-strategy=NATIVE

spring.mvc.log-request-details=true

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.mapper.sort-properties-alphabetically=true
spring.jackson.serialization.order-map-entries-by-keys=true
spring.jackson.deserialization.accept-single-value-as-array=true

spring.http.clients.reactive.connector=reactor
spring.http.clients.read-timeout=30m
spring.http.codecs.max-in-memory-size=16MB
spring.http.codecs.log-request-details=true

spring.data.web.pageable.max-page-size=200
spring.data.web.pageable.serialization-mode=via-dto

spring.jpa.open-in-view=false

management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

#logging.level.org.hibernate.SQL=TRACE
logging.level.org.springframework.web.reactive=TRACE
logging.level.org.springframework.http.codec=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE

springdoc.writer-with-default-pretty-printer=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=0
springdoc.swagger-ui.default-model-expand-depth=3
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[0].name=default
springdoc.swagger-ui.urlsPrimaryName=default